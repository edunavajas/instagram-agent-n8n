      <title id="arquitectura-title">Los nueve flujos del agente de Instagram</title>
      <desc id="arquitectura-desc">Meta envía webhooks firmados a IG 01, que reparte comentarios a IG 02 y mensajes a IG 03; las respuestas salen por IG 04 e IG 08, y los borradores dudosos pasan por IG 05, Telegram e IG 06.</desc>
